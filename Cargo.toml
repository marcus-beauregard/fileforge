[package]
name = "fileforge"
version = "0.1.0"
edition = "2021"
description = "Organize a messy folder by moving files into per-extension subfolders"
license = "MIT"
repository = "https://github.com/marcus-beauregard/fileforge"
keywords = ["cli", "files", "organize", "productivity"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
